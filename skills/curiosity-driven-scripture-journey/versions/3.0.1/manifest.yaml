name: curiosity-driven-scripture-journey
release: 3.0.1
status: current
released: 2026-09-07

compatibility:
  source_library_registry_schema: ">=2,<3"
  source_library_sqlite_schema: ">=2,<3"
  project_state_storage: file-based
  sqlite_project_state: deferred
  cross_skill_dependencies: pinned-by-release-commit

workflow:
  substantial_new_work: develop-then-build
  default_ideation_mode: standard
  full_matrix_available: true
  default_accessibility_minimum: WCAG-2.2-AA
  default_experience_target: AA
  deterministic_html_audit_required: true

security:
  public_write_abuse_protection: required
  default_challenge_strategy: escalate-only
  sms_requires_valid_phone_and_approved_capability: true
